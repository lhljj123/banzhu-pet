<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>伴桌</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="pet-stage">
    <canvas id="petCanvas" aria-label="3D 桌宠猫猫"></canvas>
    <section class="reminder" id="reminder" aria-live="polite">
      <strong>还有 5 分钟</strong>
      <span>保存一下，准备休息啦</span>
    </section>
  </main>
  <script>window.addEventListener('error', event => window.desktopPet?.reportError(`${event.message} @ ${event.filename}:${event.lineno}`));</script>
  <script src="app.bundle.js"></script>
</body>
</html>
